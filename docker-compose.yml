# Server deployment: images from GitHub Container Registry, no local build.
#
#   server:  docker compose -f docker-compose.yml ...
#   local:   docker compose up -d --build
#
# The local build lives in docker-compose.override.yml, which compose merges
# automatically. On the server deploy.sh always passes -f docker-compose.yml,
# so the override is never merged and Docker never tries to build there.

services:
  recorder:
    image: ghcr.io/maclor/sdr-recorder/recorder:${IMAGE_TAG:-latest}
    container_name: sdr-recorder
    restart: unless-stopped
    environment:
      OPENWEBRX_WS_URL: ${OPENWEBRX_WS_URL:-ws://192.168.68.67:8073/ws/}
      FREQUENCIES: ${FREQUENCIES:-149287500:nfm}
      SQUELCH_MARGIN: "${SQUELCH_MARGIN:-10}"
      RMS_MARGIN: "${RMS_MARGIN:-20}"
      PRE_ROLL_SECONDS: "${PRE_ROLL_SECONDS:-2}"
      END_SILENCE_SECONDS: "${END_SILENCE_SECONDS:-3}"
      MIN_DURATION_SECONDS: "${MIN_DURATION_SECONDS:-1}"
      MAX_RECORDING_SECONDS: "${MAX_RECORDING_SECONDS:-600}"
      NOISE_WINDOW_SECONDS: "${NOISE_WINDOW_SECONDS:-600}"
      MP3_BITRATE: "${MP3_BITRATE:-32}"
      OUTPUT_RATE: "${OUTPUT_RATE:-12000}"
      DENOISE_ENABLED: "${DENOISE_ENABLED:-1}"
      DENOISE_BACKEND: "${DENOISE_BACKEND:-deepfilternet}"
      DENOISE_NR: "${DENOISE_NR:-12}"
      DENOISE_NOISE_FLOOR_DB: "${DENOISE_NOISE_FLOOR_DB:--45}"
      DEEPFILTER_POST_FILTER: "${DEEPFILTER_POST_FILTER:-1}"
      DEEPFILTER_COMPENSATE_DELAY: "${DEEPFILTER_COMPENSATE_DELAY:-1}"
      DENOISE_SILENCE_DB: "${DENOISE_SILENCE_DB:--42}"
      DENOISE_MIN_SIGNAL_SECONDS: "${DENOISE_MIN_SIGNAL_SECONDS:-0.5}"
      TZ: ${TZ:-Europe/Warsaw}
      RECORDINGS_DIR: /recordings
    volumes:
      - ${RECORDINGS_DIR:-./recordings}:/recordings
    extra_hosts:
      # Useful when OpenWebRX runs on this same host:
      # OPENWEBRX_WS_URL=ws://host.docker.internal:8073/ws/
      - "host.docker.internal:host-gateway"

  web:
    image: ghcr.io/maclor/sdr-recorder/web:${IMAGE_TAG:-latest}
    container_name: sdr-recorder-web
    restart: unless-stopped
    environment:
      RECORDINGS_DIR: /recordings
      WEB_PORT: "8074"
      TZ: ${TZ:-Europe/Warsaw}
    volumes:
      - ${RECORDINGS_DIR:-./recordings}:/recordings
    ports:
      # ${WEB_PORT} is the host port; inside the container it is always 8074.
      - "${WEB_PORT:-8074}:8074"

  transcriber:
    image: ghcr.io/maclor/sdr-recorder/transcriber:${IMAGE_TAG:-latest}
    container_name: sdr-transcriber
    restart: unless-stopped
    environment:
      RECORDINGS_DIR: /recordings
      MIN_AGE_SECONDS: "${MIN_AGE_SECONDS:-300}"
      LANGUAGE: ${LANGUAGE:-pl}
      PRE_ROLL_SECONDS: "${PRE_ROLL_SECONDS:-2}"
      MAX_FILE_MB: "${MAX_FILE_MB:-20}"
      THREADS: "${THREADS:-3}"
      WHISPER_BEAM_SIZE: "${WHISPER_BEAM_SIZE:-2}"
      WHISPER_BEST_OF: "${WHISPER_BEST_OF:-2}"
      WHISPER_NO_SPEECH_THRESHOLD: "${WHISPER_NO_SPEECH_THRESHOLD:-0.6}"
      WHISPER_SUPPRESS_NON_SPEECH: "${WHISPER_SUPPRESS_NON_SPEECH:-1}"
      TZ: ${TZ:-Europe/Warsaw}
    volumes:
      - ${RECORDINGS_DIR:-./recordings}:/recordings
